<!DOCTYPE html>
<!--
  قالب محاضرة جديدة بهوية الموقع
  1) انسخ هذا الملف إلى: courses/<id-المادة>/chapter-N.html  (يجب أن يطابق اسم المجلد id المادة في data/data.js)
  2) عدّل العنوان والمحتوى. الشريط العلوي والتنقل السابق/التالي والتذييل تُضاف تلقائيًا
     من lecture-shell.js بحسب ترتيب chapters في data/data.js.
  3) سجّل المحاضرة في data/data.js (راجع README.md).
  ملاحظة: lecture.css يوفّر نفس رموز التصميم (--em, --text, --surface …) ويدعم السمة الفاتحة والداكنة.
-->
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>عنوان المحاضرة — قسم الذكاء الاصطناعي</title>
<link rel="stylesheet" href="../../assets/css/fonts.css?v=7">
<link rel="stylesheet" href="../../assets/css/lecture.css?v=7">
<script>var t='light';try{t=localStorage.getItem('theme')||'light'}catch(e){}document.documentElement.dataset.theme=t</script>
<style>
  *{box-sizing:border-box} body{margin:0;line-height:1.8}
  .lecture{max-width:820px;margin:0 auto;padding:48px 20px 24px}
  .lecture h1{font-size:clamp(28px,5vw,46px);line-height:1.3;margin:8px 0 12px}
  .lecture h2{margin:40px 0 10px;font-size:24px}
  .lecture p{color:var(--text2)}
  .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--em)}
</style>
</head>
<body>
<main class="lecture">
  <span class="eyebrow">CHAPTER 01</span>
  <h1>عنوان المحاضرة</h1>
  <p>مقدمة قصيرة عن المحاضرة.</p>
  <h2>القسم الأول</h2>
  <p>اكتب المحتوى هنا.</p>
</main>
<footer class="site-footer"></footer>
<script src="../../data/data.js?v=5"></script>
<script src="../../assets/js/lecture-shell.js?v=5"></script>
</body>
</html>
