<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مقدمة في الحوسبة — الفصل الثاني: أجهزة الإدخال</title>
<link rel="stylesheet" href="../../assets/css/fonts.css?v=12">
<style>
/* =====================================================================
   CompuBasics — ثنائي اللغة (عربي / English)
   مبدأ الحركة: كل حركة إمّا (1) تمثّل عملية حقيقية في الحاسوب (انتقال بيانات، معالجة، حفظ)
   أو (2) استجابة مباشرة لتفاعل الطالب. لا توجد حركات زخرفية.
   الرسومات تنعكس مع اتجاه اللغة: العربية من اليمين لليسار، والإنجليزية من اليسار لليمين.
   ===================================================================== */
:root{--header-h:64px}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--header-h) + 12px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
p{margin:0}
.mono{font-family:var(--mono);font-weight:500}
.ltr{direction:ltr;unicode-bidi:isolate}
/* التسمية الثانوية باللغة الأخرى: إنجليزية بخط Mono في الوضع العربي، وعربية بخط Cairo في الوضع الإنجليزي */
html[lang=ar] .alt{font-family:var(--mono);font-weight:500}
html[lang=en] .alt{font-family:var(--font);font-weight:600}

/* ---------- Header ---------- */
.site-header{position:sticky;top:0;z-index:20;background:rgb(var(--s0) / 0.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:var(--text);border-bottom:1px solid rgb(var(--acc) / 0.2);box-shadow:0 4px 20px rgba(0,0,0,.5)}
.header-container{max-width:1280px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:14px;min-height:var(--header-h)}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.brand-logo{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--blue),var(--em2));display:grid;place-items:center;font-weight:800;color:var(--em-ink);font-size:16px;box-shadow:0 0 12px rgb(var(--acc) / 0.4)}
.brand-name{font-weight:800;font-size:18px;letter-spacing:.2px;color:var(--text)}
.brand-sub{font-size:14px;color:rgb(var(--ink) / 0.75)}
.header-instructor{font-size:12px;opacity:.9;background:rgb(var(--acc) / .15);border:1px solid rgb(var(--acc) / .3);color:var(--blue);padding:2px 10px;border-radius:6px;margin-inline-start:4px}
.header-nav{flex:1 1 auto;min-width:0;display:flex;justify-content:flex-end;gap:2px;font-size:14px;font-weight:600;align-items:center;overflow-x:auto;scrollbar-width:none}
.header-nav::-webkit-scrollbar{display:none}
.header-nav a{padding:5px 12px;border-radius:999px;white-space:nowrap;color:rgb(var(--ink) / .82);transition:background .2s,color .2s}
.header-nav a:hover{color:var(--blue);background:rgb(var(--acc) / .12)}
.header-nav a.active{color:var(--blue);background:rgb(var(--acc) / .18);border:1px solid rgb(var(--acc) / .3)}
.header-nav a.nav-quiz{color:var(--orange);background:rgb(var(--amb) / .15);padding:5px 14px;border:1px solid rgb(var(--amb) / .3)}
.header-nav a.nav-quiz.active{background:var(--orange);color:var(--em-ink)}
.lang-switch{flex:none;display:inline-flex;background:rgb(var(--ink) / .08);border:1px solid rgb(var(--acc) / .22);border-radius:999px;padding:3px;gap:2px}
.lang-switch button{cursor:pointer;border:0;background:transparent;color:rgb(var(--ink) / .85);font-weight:700;font-size:13px;line-height:1.5;padding:4px 12px;border-radius:999px;transition:background .2s,color .2s}
.lang-switch button:hover{color:var(--blue);background:rgb(var(--acc) / .1)}
.lang-switch button[aria-pressed=true]{background:var(--blue);color:var(--em-ink)}
.read-progress{height:3px;background:rgb(var(--ink) / .08)}
.read-progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--orange))}

/* ---------- Hero ---------- */
.hero-section{background:var(--navy);color:var(--text);padding:56px 24px 72px}
.hero-container{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:48px;align-items:center}
.hero-text-block{display:flex;flex-direction:column;gap:18px;align-items:center;text-align:center}
.hero-badges{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center}
.hero-badge{font-size:13px;font-weight:700;background:rgb(var(--ink) / .1);padding:4px 14px;border-radius:999px}
.hero-instructor{font-size:13px;font-weight:700;background:var(--orange);color:var(--navy);padding:4px 14px;border-radius:999px}
.hero-section h1{margin:0;font-size:clamp(32px,5vw,52px);line-height:1.25;font-weight:800;text-wrap:pretty;text-align:center}
.hero-lead{font-size:18px;opacity:.85;max-width:520px;text-wrap:pretty;text-align:center;margin-left:auto;margin-right:auto}
.hero-buttons{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px;justify-content:center}
.btn{display:inline-block;font-weight:700;padding:12px 24px;border-radius:10px;transition:transform .15s,box-shadow .15s,background .2s}
.btn-primary{background:var(--orange);color:var(--navy);box-shadow:0 4px 12px rgb(var(--amb) / .3)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgb(var(--amb) / .4)}
.btn-ghost{border:1.5px solid rgb(var(--ink) / .4);color:var(--text);font-weight:600}
.btn-ghost:hover{background:rgb(var(--ink) / .08)}

.sim-card{background:rgb(var(--ink) / .05);border:1.5px solid rgb(var(--ink) / .14);border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:18px;box-shadow:0 16px 40px -10px rgba(0,0,0,.3)}
.sim-panel{background:rgb(var(--s0) / .7);border-radius:16px;padding:14px 14px 12px;border:1px solid rgb(var(--amb) / .3)}
.sim-head{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;margin-bottom:6px;flex-wrap:wrap}
.sim-title{font-weight:800;color:var(--orange);display:flex;align-items:center;gap:8px}
.live-dot{position:relative;display:inline-block;width:8px;height:8px;border-radius:50%;background:#7C8BA0;flex:none}
.live-dot.on{background:var(--green)}
.live-dot.on::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--green);animation:livePing 1.6s ease-out infinite}
@keyframes livePing{from{transform:scale(.6);opacity:.9}to{transform:scale(1.6);opacity:0}}
.auto-toggle{cursor:pointer;font-size:12px;font-weight:700;color:var(--text);background:rgb(var(--ink) / .08);border:1px solid rgb(var(--ink) / .2);border-radius:999px;padding:3px 12px;transition:background .2s}
.auto-toggle:hover{background:rgb(var(--ink) / .16)}

.legend{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;font-size:12px;margin-top:4px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg-data{display:inline-flex;gap:2px}
.lg-data i{width:6px;height:6px;border-radius:1.5px;background:var(--data)}
.lg-info{width:10px;height:13px;border-radius:2px;background:var(--info)}
.hero-section .legend{color:var(--text2)}
.hero-section .lg-data i{background:#A0AEC0}

.hero-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:12px}
.hc{position:relative;overflow:hidden;text-align:start;cursor:pointer;border-radius:14px;padding:14px 16px;border:1.5px solid rgb(var(--ink) / .15);background:rgb(var(--ink) / .04);color:var(--text);display:flex;flex-direction:column;gap:2px;transition:background .3s,border-color .3s,color .3s}
.hc:hover{border-color:rgb(var(--amb) / .6)}
.hc.on{background:var(--orange);border-color:var(--orange);color:var(--navy)}
.hc-top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.hc-top .alt{font-size:12px;opacity:.8}
.hc-icon{font-size:22px}
.hc-name{font-size:22px;font-weight:800}
.hc-chef{font-size:13px;opacity:.85}
.sim-analogy{font-size:14px;opacity:.9;text-wrap:pretty;text-align:center;background:rgb(var(--ink) / .06);padding:10px 16px;border-radius:12px;border:1px solid rgb(var(--ink) / .1)}

/* شريط التقدم التلقائي: يوضح متى ينتقل العرض إلى المرحلة التالية */
.autobar{position:absolute;bottom:0;inset-inline-start:0;height:3px;width:0;background:currentColor;opacity:.45}
.autobar.run{animation:autobar var(--step-ms,3500ms) linear forwards}
@keyframes autobar{from{width:0}to{width:100%}}

/* ---------- Sections ---------- */
.main-container{max-width:1120px;margin:0 auto;padding:0 24px}
.section{padding:72px 0 24px;display:flex;flex-direction:column;gap:28px}
.section-header{display:flex;flex-direction:column;gap:6px;text-align:center;align-items:center}
.section-subtitle{font-size:14px;font-weight:700;color:var(--blue);font-family:var(--mono)}
html[lang=en] .section-subtitle{font-family:var(--font)}
.section-title{margin:0;font-size:clamp(26px,3.6vw,34px);font-weight:800;line-height:1.35;color:var(--text);text-wrap:balance}
.section-desc{font-size:17px;color:var(--text2);max-width:760px;text-wrap:pretty}
.sub-title{margin:0;font-size:24px;font-weight:800;text-align:center;color:var(--text)}
.sub-title small{font-size:15px;color:var(--blue);font-weight:600}
.card{background:rgb(var(--s1) / 0.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:20px;padding:28px;color:var(--text);box-shadow:0 12px 36px rgba(0,0,0,0.5),0 0 20px rgb(var(--acc) / 0.06)}
.kv{display:flex;flex-direction:column;gap:4px}
.kv .k{font-size:13px;color:var(--muted);font-weight:600}
.kv.example{background:rgb(var(--amb) / 0.12);border:1px solid rgb(var(--amb) / 0.3);border-radius:12px;padding:12px 16px}
.kv.example .k{color:var(--orange);font-weight:700}
.swap{animation:swapIn .35s ease}
@keyframes swapIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Cycle pills */
.pills{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center}
.pill{position:relative;overflow:hidden;cursor:pointer;display:flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;border:1.5px solid var(--line);background:rgb(var(--s1) / 0.7);color:var(--text);font-weight:700;font-size:15px;transition:all .25s}
.pill:hover{border-color:var(--blue)}
.pill.on{background:var(--blue);color:var(--em-ink);border-color:var(--blue);box-shadow:0 0 15px rgb(var(--acc) / 0.4)}
.pill .alt{font-size:12px;opacity:.75}
.stage-detail{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;align-items:center}
.stage-info{display:flex;flex-direction:column;gap:16px}
.stage-name{font-size:26px;font-weight:800;color:var(--text)}
.stage-name .alt{font-size:15px;color:var(--blue)}
.stage-what{font-size:18px;font-weight:600;color:var(--text)}
.stage-ex{font-size:17px;font-weight:600;color:var(--orange)}

/* Cycle diagram (SVG) */
.cycle-diagram svg{display:block;width:100%;height:auto;overflow:visible}
.cyc{--n-fill:rgb(var(--s1) / 0.9);--n-stroke:rgb(var(--acc) / 0.3);--n-text:var(--text);--n-muted:var(--muted);--n-on:rgb(var(--amb) / 0.25);--l:rgb(var(--acc) / 0.35);--pk-data:var(--data)}
[data-theme=dark] .cyc{--n-fill:rgb(var(--s0) / 0.95);--n-stroke:rgb(var(--acc) / 0.4);--n-text:var(--text);--n-muted:var(--muted);--n-on:rgb(var(--amb) / 0.3);--l:rgb(var(--acc) / 0.4);--pk-data:var(--blue)}
.cyc .node rect{fill:var(--n-fill);stroke:var(--n-stroke);stroke-width:1.5;transition:fill .35s,stroke .35s}
.cyc .node.on rect{fill:var(--n-on);stroke:var(--orange);stroke-width:2.5}
.cyc text{text-anchor:middle}
.cyc .t-ico{font-size:21px}
.cyc .t-main{fill:var(--n-text);font-weight:800;font-size:13px}
.cyc .t-alt{fill:var(--n-muted);font-size:9.5px}
html[lang=ar] .t-alt{font-family:var(--mono);font-weight:500}
html[lang=en] .t-alt{font-family:var(--font);font-weight:600;font-size:10.5px}
.cyc .link{stroke:var(--l);stroke-width:2;fill:none;transition:stroke .35s}
.cyc .link.on{stroke:var(--orange);stroke-width:2.5}
.cyc .ah{fill:var(--l)}
.cyc .ah-on{fill:var(--orange)}
.cyc .pk-data rect{fill:var(--pk-data)}
.cyc .pk-info rect.doc{fill:var(--info)}
.cyc .pk-info line{stroke:var(--text);stroke-width:1.4;stroke-linecap:round}

/* Data vs information */
.data-info{position:relative}
.data-info-grid{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:16px;align-items:stretch}
.di-card{background:rgb(var(--s1) / 0.8);border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:10px;text-align:center;align-items:center;border:1.5px solid var(--line);transition:box-shadow .3s}
.di-data{border:1.5px dashed rgb(var(--acc) / 0.4)}
.di-info{border:1.5px solid var(--green)}
.di-emoji{font-size:24px}
.di-label{font-size:13px;font-weight:700;color:var(--muted)}
.di-info .di-label{color:var(--green-deep)}
.di-text{font-size:16px;color:var(--text)}
.di-sample{font-family:var(--mono);font-weight:500;font-size:18px;background:rgb(var(--s0) / 0.85);color:var(--blue);border-radius:8px;padding:6px 16px;direction:ltr;border:1px solid var(--line);transition:box-shadow .3s}
.di-result{font-size:18px;font-weight:700;background:var(--green-bg);color:var(--green);border:1px solid rgba(0,230,118,0.4);border-radius:8px;padding:6px 16px;transition:box-shadow .3s}
.di-note{font-size:14px;color:var(--muted)}
.di-sample.hl{box-shadow:0 0 0 3px rgb(var(--acc) / 0.45)}
.di-result.hl{box-shadow:0 0 0 3px rgba(0,230,118,0.45)}
.data-info-arrow{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--blue);font-weight:700;font-size:14px;min-width:80px}
.gear{display:inline-block;font-size:32px;line-height:1}
.data-info-arrow-icon{font-size:24px;line-height:1;display:inline-block}
.tok{position:absolute;top:0;left:0;pointer-events:none;opacity:0;z-index:2}
.tok-data{display:flex;gap:3px}
.tok-data i{width:9px;height:9px;border-radius:2px;background:var(--data)}
.tok-info{width:16px;height:20px;border-radius:3px;background:var(--info);box-shadow:0 2px 6px rgba(0,230,118,0.5)}
.plain-note{font-size:15px;color:var(--text2);text-align:center;background:rgb(var(--s1) / 0.8);padding:12px 18px;border-radius:12px;border:1px solid var(--line)}

/* ---------- Components ---------- */
.components-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px}
.cb{cursor:pointer;text-align:center;border-radius:16px;padding:18px;border:1.5px solid var(--line);background:rgb(var(--s1) / 0.75);color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:all .25s}
.cb:hover{border-color:var(--blue)}
.cb.on{background:linear-gradient(135deg,rgb(var(--acc) / 0.25),rgb(var(--acc) / 0.05));border-color:var(--blue);color:var(--text);box-shadow:0 0 20px rgb(var(--acc) / 0.3)}
.cb-ico{font-size:26px;margin-bottom:2px}
.cb .alt{font-size:12px;opacity:.75}
.cb-name{font-size:19px;font-weight:800;line-height:1.4}
.cb-fac{font-size:13px;opacity:.85;color:var(--muted)}
.comp-detail{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;align-items:center}
.comp-info{display:flex;flex-direction:column;gap:20px}
.comp-func{font-size:22px;font-weight:800;color:var(--text)}
.comp-fac{font-size:15px;color:var(--text2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--chip);color:var(--blue);border:1px solid rgb(var(--acc) / 0.3);font-weight:600;font-size:15px;padding:6px 14px;border-radius:999px}
.comp-svg svg{display:block;width:100%;height:auto}
.cmp .box{fill:rgb(var(--s0) / 0.85);stroke:var(--line);stroke-width:1.5;transition:fill .35s,stroke .35s}
.cmp .n.on .box{fill:rgb(var(--acc) / 0.15);stroke:var(--blue);stroke-width:2.5}
.cmp .n.dim{opacity:.55}
.cmp .n{transition:opacity .35s}
.cmp .other .box{stroke-dasharray:5 4}
.cmp text{text-anchor:middle}
.cmp .t-main{fill:var(--text);font-weight:800;font-size:13px}
.cmp .t-sm{fill:var(--text);font-weight:700;font-size:12px}
.cmp .t-ico{font-size:20px}
.cmp .inner{fill:rgb(var(--s1) / 0.9);stroke:var(--line2);stroke-width:1.2;transition:fill .35s,stroke .35s}
.cmp .n.on .inner{fill:rgb(var(--acc) / 0.2);stroke:var(--blue2)}
.cmp .ln{stroke:rgb(var(--acc) / 0.3);stroke-width:2;fill:none;transition:stroke .35s}
.cmp .ln.on{stroke:var(--blue);stroke-width:2.5;stroke-dasharray:6 6;animation:flow .9s linear infinite}
.cmp .ah{fill:rgb(var(--acc) / 0.3)}
.cmp .ah-on{fill:var(--blue)}
@keyframes flow{from{stroke-dashoffset:12}to{stroke-dashoffset:0}}

/* ---------- Software ---------- */
.sw-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.sw-card{border-radius:18px;padding:28px;display:flex;flex-direction:column;gap:10px;text-align:center;align-items:center;background:rgb(var(--s1) / 0.85);border:1.5px solid var(--line);color:var(--text)}
.sw-sys{background:rgb(var(--s0) / 0.95);border-color:var(--blue);box-shadow:0 0 20px rgb(var(--acc) / 0.15)}
.sw-app{background:rgb(var(--s1) / 0.85);border:1.5px solid var(--line2)}
.sw-ico{font-size:28px}
.sw-card .alt{font-size:13px}
.sw-sys .alt{color:var(--blue)}
.sw-app .alt{color:var(--muted)}
.sw-name{font-size:24px;font-weight:800;color:var(--text)}
.sw-role{font-size:17px}
.sw-sys .sw-role{color:var(--text2)}
.sw-app .sw-role{color:var(--text2)}
.sw-tags{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.sw-sys .sw-tags span{background:rgb(var(--acc) / .15);border:1px solid rgb(var(--acc) / .3);color:var(--blue);padding:4px 12px;border-radius:999px;font-size:14px}
.sw-app .sw-tags span{background:var(--chip);padding:4px 12px;border-radius:999px;font-size:14px;color:var(--text);border:1px solid var(--line);font-weight:600}
.run-head{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.play-btn{cursor:pointer;font-size:14px;font-weight:700;border:1.5px solid var(--blue);background:rgb(var(--acc) / 0.1);color:var(--blue);border-radius:999px;padding:5px 16px;transition:all .2s}
.play-btn:hover{background:var(--blue);color:var(--em-ink)}
.run-steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}
.rs{cursor:pointer;text-align:start;background:rgb(var(--s1) / 0.8);border:1.5px solid var(--line);border-radius:14px;padding:18px;display:flex;gap:14px;align-items:center;color:var(--text);transition:all .25s}
.rs:hover{border-color:var(--blue)}
.rs.on{border-color:var(--blue);box-shadow:0 0 0 3px rgb(var(--acc) / .25)}
.rs-num{flex:none;width:36px;height:36px;border-radius:50%;background:var(--blue);color:var(--em-ink);display:grid;place-items:center;font-weight:800;font-size:16px}
.rs-num.g{background:var(--green)}
.rs strong{font-size:17px;color:var(--text)}
.rs .d{color:var(--text2);font-size:14px}
.run-svg{background:rgb(var(--s0) / 0.9);border:1px solid var(--line);border-radius:18px;padding:16px 12px 8px}
.run-svg svg{display:block;width:100%;max-width:680px;height:auto;margin:0 auto}
.prg .box{fill:rgb(var(--s1) / 0.9);stroke:var(--line2);stroke-width:1.5;transition:fill .35s,stroke .35s}
.prg .n.on .box{fill:rgb(var(--acc) / 0.15);stroke:var(--blue2);stroke-width:2.5}
.prg text{text-anchor:middle}
.prg .t-main{fill:var(--text);font-weight:800;font-size:13px}
.prg .ico{fill:none;stroke:var(--blue);stroke-width:2}
.prg .ico-f{fill:var(--blue)}
.prg .ln{stroke:rgb(var(--acc) / 0.3);stroke-width:2;fill:none;transition:stroke .35s}
.prg .ln.on{stroke:var(--blue2);stroke-width:2.5}

.d-list li{background:rgb(var(--s0) / .8);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:15px}
.d-list li b{color:var(--text)} .d-list li span{color:var(--text2)}
.fact-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px}
.fact{background:rgb(var(--s1) / .8);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.fact .k{font-size:13px;font-weight:700;color:var(--orange)}
.fact .v{font-size:15px;color:var(--text)}
.fact .chips{margin-top:2px} .fact .chip{font-size:13px;padding:3px 10px}

/* لوحة المفاتيح */
.kbd-wrap{overflow-x:auto;padding-bottom:4px}
.kbd-wrap svg{display:block;width:100%;min-width:660px;height:auto;direction:ltr}
.key rect{fill:rgb(var(--s1) / .95);stroke:rgb(var(--ink) / .22);stroke-width:1;transition:fill .2s,stroke .2s}
.key text{fill:var(--text2);font-family:var(--mono);font-size:8.5px;font-weight:500;text-anchor:middle;pointer-events:none}
.key{cursor:pointer}
.key.hl rect{fill:rgb(var(--acc) / .28);stroke:var(--blue)} .key.hl text{fill:var(--text)}
.key.down rect{fill:var(--orange);stroke:var(--orange)} .key.down text{fill:var(--em-ink)}
.key.lit rect{stroke:var(--green);stroke-width:2}
.type-line{direction:ltr;text-align:left;font-family:var(--mono);font-size:18px;min-height:46px;background:rgb(var(--s0) / .9);border:1px solid var(--line);border-radius:12px;padding:8px 14px;color:var(--text);white-space:pre-wrap;word-break:break-all}
.caret{display:inline-block;width:2px;height:1.15em;background:var(--orange);vertical-align:text-bottom;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.type-meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.led{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.led i{width:9px;height:9px;border-radius:50%;background:#44546A} .led.on i{background:var(--green);box-shadow:0 0 8px var(--green)} .led.on{color:var(--green)}

.mouse-svg{max-width:240px;margin:0 auto}
.ms .body{fill:rgb(var(--s1) / .95);stroke:rgb(var(--ink) / .35);stroke-width:2}
.ms .part{fill:rgb(var(--s0) / .9);stroke:rgb(var(--ink) / .35);stroke-width:1.5;transition:fill .15s}
.ms .part.hold{fill:var(--orange)}
.ms .part.b1{animation:press .45s ease 1} .ms .part.b2{animation:press .3s ease 2} .ms .part.b3{animation:press .25s ease 3}
@keyframes press{0%,100%{fill:rgb(var(--s0) / .9)}40%,70%{fill:var(--orange)}}
.ms .ticks{stroke:var(--blue);stroke-width:2;stroke-dasharray:3 5;opacity:0}
.ms .ticks.rot{opacity:1;animation:flow .5s linear infinite} .ms .ticks.spin{opacity:1;animation:flow .12s linear infinite}
.ms .wheelg{transition:transform .25s} .ms .wheelg.tilt{animation:tilt 1s ease-in-out 2}
@keyframes tilt{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.ms .mv{opacity:0} .ms .mv.on{opacity:1}
.ms .whole.moving{animation:mmove 1.6s ease-in-out 1}
@keyframes mmove{0%,100%{transform:translate(0,0)}50%{transform:translate(26px,-14px)}}
.ms .lbl{fill:var(--text2);font-size:10.5px;font-weight:600}
.op-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.op{cursor:pointer;border-radius:10px;padding:8px 10px;border:1.5px solid var(--line);background:rgb(var(--s1) / .7);color:var(--text);font-weight:700;font-size:14px;text-align:start;transition:all .2s}

.run-svg{overflow-x:auto}#camSvg svg{min-width:560px}

.px-canvas{width:100%;max-width:300px;aspect-ratio:1;border-radius:12px;border:1px solid var(--line);object-fit:cover;display:block;margin:0 auto;background:#000}
.px-read{font-size:14px;font-weight:700;color:var(--blue);text-align:center;margin-top:8px;line-height:1.7}.px-read bdi{font-family:var(--mono);font-weight:500}
.rd #rdObj{fill:var(--text)}

/* القارئات */
.rd .beam{opacity:0;fill:none}
.rd.light .b-light,.rd.laser .b-laser,.rd.radio .b-radio{opacity:1}
.rd .b-light{stroke:#FFD54A;stroke-width:2.5;stroke-dasharray:5 6;animation:flow .7s linear infinite}
.rd .b-laser{stroke:var(--red);stroke-width:2.5}
.rd.laser .b-laser{animation:sweep 1.2s ease-in-out infinite alternate}
@keyframes sweep{from{transform:translateY(-12px)}to{transform:translateY(12px)}}
.rd .b-radio path{stroke:var(--blue);stroke-width:2.5;fill:none;opacity:.2;animation:rad 1.5s linear infinite}
.rd .b-radio path:nth-child(2){animation-delay:.3s} .rd .b-radio path:nth-child(3){animation-delay:.6s}
@keyframes rad{0%{opacity:.15}30%{opacity:1}100%{opacity:.15}}
.rd.mag .obj{animation:swipe 1.8s ease-in-out infinite}
@keyframes swipe{0%,100%{transform:translateY(-26px)}50%{transform:translateY(26px)}}
.sig-tag{display:inline-block;font-size:13px;font-weight:800;color:var(--em-ink);background:var(--orange);border-radius:999px;padding:2px 12px;align-self:flex-start}

.grid-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}
.gcard{background:rgb(var(--s1) / .85);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:6px}
.gcard .ico{font-size:24px} .gcard b{font-size:17px;color:var(--text)} .gcard .alt{font-size:12px;color:var(--blue)} .gcard span.d{font-size:14.5px;color:var(--text2)}

  $$('[data-t]').forEach(el => { el.innerHTML = t(el.dataset.t); });
  $$('[data-t-aria]').forEach(el => el.setAttribute('aria-label', t(el.dataset.tAria)));
  $$('.section-subtitle').forEach(el => el.setAttribute('dir', rtl() ? 'ltr' : 'rtl'));
  $$('.lang-switch button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === LANG));
  $$('.chap-switch a').forEach(a => { a.href = a.getAttribute('href').split('?')[0] + '?lang=' + LANG; });
  buildInput(); picker('#inPills', INPUT, d => d[LANG].name, renderInput, inSt);
  buildKeyboard(); picker('#kbPills', ZONES, d => d[LANG].name, renderZone, kb); renderType(); buildKbFacts();
  buildMouse(); renderOp(false);
  picker('#tcPills', TOUCH, d => d[LANG].name, (i, a) => textDetail('#tcDetail', TOUCH[i], a), tcSt);
  buildCards();
  buildCam(); cam.play++; camState(cam.cur); buildPx();
  picker('#mdPills', MEDIA, d => d[LANG].name, (i, a) => textDetail('#mdDetail', MEDIA[i], a), mdSt);
  buildScan(); sc.play++; scState(sc.cur); buildReaderSvg(); picker('#rdPills', READERS, d => d[LANG].name, renderReader, rdSt);
  picker('#usPills', USERS, d => d[LANG], renderUser, usSt);
  buildQuiz(); renderQuiz();
  if (!first) { try { localStorage.setItem('cb-lang', LANG); } catch (e) {} try { const u = new URL(location.href); u.searchParams.set('lang', LANG); history.replaceState(null, '', u); } catch (e) {} }
}
$$('.lang-switch button').forEach(b => b.addEventListener('click', () => { if (b.dataset.lang !== LANG) setLang(b.dataset.lang); }));
function initialLang() {
  try { const q = new URLSearchParams(location.search).get('lang'); if (q === 'en' || q === 'ar') return q; } catch (e) {}
  try { const s = localStorage.getItem('cb-lang'); if (s === 'en' || s === 'ar') return s; } catch (e) {}
  return 'ar';
}
setLang(initialLang(), true);
// المخططات ذات الخطوات تُعرض تلقائياً مرة واحدة عند أول ظهور
const once = (sel, fn, st) => new IntersectionObserver((es, ob) => { if (es[0].isIntersecting) { ob.disconnect(); if (st.cur === 0) fn(); } }, { threshold: .6 }).observe($(sel));
once('#camSvg', playCam, cam); once('#scSvg', playScan, sc);

const navLinks = $$('#nav a');
const secObs = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) navLinks.forEach(a => a.classList.toggle('active', a.getAttribute('href') === '#' + e.target.id)); }), { rootMargin: '-40% 0px -55% 0px' });
['top', 'what', 'keyboard', 'pointing', 'touch', 'camera', 'media', 'scan', 'bio', 'users', 'quiz'].forEach(id => secObs.observe(document.getElementById(id)));
const bar = $('#readBar');
const onScroll = () => { const h = document.documentElement.scrollHeight - innerHeight; bar.style.width = (h > 0 ? scrollY / h * 100 : 0) + '%'; };
addEventListener('scroll', onScroll, { passive: true }); onScroll();
})();
