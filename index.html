<style>
/* =====================================================================
   CompuBasics — ثنائي اللغة (عربي / English)
   مبدأ الحركة: كل حركة إمّا (1) تمثّل عملية حقيقية في الحاسوب (انتقال بيانات، معالجة، حفظ)
   أو (2) استجابة مباشرة لتفاعل الطالب. لا توجد حركات زخرفية.
   الرسومات تنعكس مع اتجاه اللغة: العربية من اليمين لليسار، والإنجليزية من اليسار لليمين.
   ===================================================================== */
:root{
  --navy:#1E3A5F; --blue:#2F6FB5; --blue2:#4A90D9;
  --orange:#F39C12; --orange-deep:#8A5A06; --cream:#FEF5E6;
  --green:#27AE60; --green-deep:#1E7B45; --green-bg:#E8F6EE;
  --red:#E74C3C; --red-deep:#B83227; --red-bg:#FDECEA;
  --bg:#F0F4F8; --card:#FFFFFF; --line:#E3E8F0; --line2:#D5DDE8;
  --muted:#5B6B80; --text2:#44546A; --chip:#EAF2FB;
  --data:#8795A8;            /* لون "البيانات الخام" في كل الرسومات */
  --info:#27AE60;            /* لون "المعلومات" في كل الرسومات */
  --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  --header-h:64px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--header-h) + 12px)}
body{margin:0;background:var(--bg);color:var(--navy);font-family:'Cairo',system-ui,sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
p{margin:0}
.mono{font-family:var(--mono);font-weight:500}
.ltr{direction:ltr;unicode-bidi:isolate}
/* التسمية الثانوية باللغة الأخرى: إنجليزية بخط Mono في الوضع العربي، وعربية بخط Cairo في الوضع الإنجليزي */
html[lang=ar] .alt{font-family:var(--mono);font-weight:500}
html[lang=en] .alt{font-family:'Cairo',system-ui,sans-serif;font-weight:600}

/* ---------- Header ---------- */
.site-header{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.header-container{max-width:1280px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:14px;min-height:var(--header-h)}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.brand-logo{width:32px;height:32px;border-radius:8px;background:var(--orange);display:grid;place-items:center;font-weight:800;color:var(--navy);font-size:16px}
.brand-name{font-weight:800;font-size:18px;letter-spacing:.2px}
.brand-sub{font-size:14px;opacity:.75}
.header-instructor{font-size:12px;opacity:.9;background:rgba(255,255,255,.12);padding:2px 10px;border-radius:6px;margin-inline-start:4px}
.header-nav{flex:1 1 auto;min-width:0;display:flex;justify-content:flex-end;gap:2px;font-size:14px;font-weight:600;align-items:center;overflow-x:auto;scrollbar-width:none}
.header-nav::-webkit-scrollbar{display:none}
.header-nav a{padding:5px 8px;border-radius:999px;white-space:nowrap;color:rgba(255,255,255,.82);transition:background .2s,color .2s}
.header-nav a:hover{color:#fff;background:rgba(255,255,255,.08)}
.header-nav a.active{color:#fff;background:rgba(255,255,255,.16)}
.header-nav a.nav-quiz{color:var(--orange);background:rgba(243,156,18,.15);padding:5px 14px}
.header-nav a.nav-quiz.active{background:var(--orange);color:var(--navy)}
.lang-switch{flex:none;display:inline-flex;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:3px;gap:2px}
.lang-switch button{cursor:pointer;border:0;background:transparent;color:rgba(255,255,255,.85);font-weight:700;font-size:13px;line-height:1.5;padding:4px 12px;border-radius:999px;transition:background .2s,color .2s}
.lang-switch button:hover{color:#fff;background:rgba(255,255,255,.1)}
.lang-switch button[aria-pressed=true]{background:#fff;color:var(--navy)}
.read-progress{height:3px;background:rgba(255,255,255,.08)}
.read-progress span{display:block;height:100%;width:0;background:var(--orange)}

/* ---------- Hero ---------- */
.hero-section{background:var(--navy);color:#fff;padding:56px 24px 72px}
.hero-container{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:48px;align-items:center}
.hero-text-block{display:flex;flex-direction:column;gap:18px;align-items:center;text-align:center}
.hero-badges{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center}
.hero-badge{font-size:13px;font-weight:700;background:rgba(255,255,255,.1);padding:4px 14px;border-radius:999px}
.hero-instructor{font-size:13px;font-weight:700;background:var(--orange);color:var(--navy);padding:4px 14px;border-radius:999px}
.hero-section h1{margin:0;font-size:clamp(32px,5vw,52px);line-height:1.25;font-weight:800;text-wrap:pretty;text-align:center}
.hero-lead{font-size:18px;opacity:.85;max-width:520px;text-wrap:pretty;text-align:center;margin-left:auto;margin-right:auto}
.hero-buttons{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px;justify-content:center}
.btn{display:inline-block;font-weight:700;padding:12px 24px;border-radius:10px;transition:transform .15s,box-shadow .15s,background .2s}
.btn-primary{background:var(--orange);color:var(--navy);box-shadow:0 4px 12px rgba(243,156,18,.3)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(243,156,18,.4)}
.btn-ghost{border:1.5px solid rgba(255,255,255,.4);color:#fff;font-weight:600}
.btn-ghost:hover{background:rgba(255,255,255,.08)}

.sim-card{background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.14);border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:18px;box-shadow:0 16px 40px -10px rgba(0,0,0,.3)}
.sim-panel{background:rgba(15,28,48,.7);border-radius:16px;padding:14px 14px 12px;border:1px solid rgba(243,156,18,.3)}
.sim-head{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;margin-bottom:6px;flex-wrap:wrap}
.sim-title{font-weight:800;color:var(--orange);display:flex;align-items:center;gap:8px}
.live-dot{position:relative;display:inline-block;width:8px;height:8px;border-radius:50%;background:#7C8BA0;flex:none}
.live-dot.on{background:var(--green)}
.live-dot.on::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--green);animation:livePing 1.6s ease-out infinite}
@keyframes livePing{from{transform:scale(.6);opacity:.9}to{transform:scale(1.6);opacity:0}}
.auto-toggle{cursor:pointer;font-size:12px;font-weight:700;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:3px 12px;transition:background .2s}
.auto-toggle:hover{background:rgba(255,255,255,.16)}

.legend{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;font-size:12px;margin-top:4px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg-data{display:inline-flex;gap:2px}
.lg-data i{width:6px;height:6px;border-radius:1.5px;background:var(--data)}
.lg-info{width:10px;height:13px;border-radius:2px;background:var(--info)}
.hero-section .legend{color:#CBD5E0}
.hero-section .lg-data i{background:#A0AEC0}

.hero-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:12px}
.hc{position:relative;overflow:hidden;text-align:start;cursor:pointer;border-radius:14px;padding:14px 16px;border:1.5px solid rgba(255,255,255,.15);background:rgba(255,255,255,.04);color:#fff;display:flex;flex-direction:column;gap:2px;transition:background .3s,border-color .3s,color .3s}
.hc:hover{border-color:rgba(243,156,18,.6)}
.hc.on{background:var(--orange);border-color:var(--orange);color:var(--navy)}
.hc-top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.hc-top .alt{font-size:12px;opacity:.8}
.hc-icon{font-size:22px}
.hc-name{font-size:22px;font-weight:800}
.hc-chef{font-size:13px;opacity:.85}
.sim-analogy{font-size:14px;opacity:.9;text-wrap:pretty;text-align:center;background:rgba(255,255,255,.06);padding:10px 16px;border-radius:12px;border:1px solid rgba(255,255,255,.1)}

/* شريط التقدم التلقائي: يوضح متى ينتقل العرض إلى المرحلة التالية */
.autobar{position:absolute;bottom:0;inset-inline-start:0;height:3px;width:0;background:currentColor;opacity:.45}
.autobar.run{animation:autobar var(--step-ms,3500ms) linear forwards}
@keyframes autobar{from{width:0}to{width:100%}}

/* ---------- Sections ---------- */
.main-container{max-width:1120px;margin:0 auto;padding:0 24px}
.section{padding:72px 0 24px;display:flex;flex-direction:column;gap:28px}
.section-header{display:flex;flex-direction:column;gap:6px;text-align:center;align-items:center}
.section-subtitle{font-size:14px;font-weight:700;color:var(--blue);font-family:var(--mono)}
html[lang=en] .section-subtitle{font-family:'Cairo',system-ui,sans-serif}
.section-title{margin:0;font-size:clamp(26px,3.6vw,34px);font-weight:800;line-height:1.35;text-wrap:balance}
.section-desc{font-size:17px;color:var(--text2);max-width:760px;text-wrap:pretty}
.sub-title{margin:0;font-size:24px;font-weight:800;text-align:center}
.sub-title small{font-size:15px;color:var(--blue);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:0 10px 30px -5px rgba(30,58,95,.08),0 4px 12px rgba(0,0,0,.03)}
.kv{display:flex;flex-direction:column;gap:4px}
.kv .k{font-size:13px;color:var(--muted);font-weight:600}
.kv.example{background:var(--cream);border-radius:12px;padding:12px 16px}
.kv.example .k{color:var(--orange-deep);font-weight:700}
.swap{animation:swapIn .35s ease}
@keyframes swapIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Cycle pills */
.pills{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center}
.pill{position:relative;overflow:hidden;cursor:pointer;display:flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;border:1.5px solid var(--line2);background:#fff;color:var(--navy);font-weight:700;font-size:15px;transition:background .25s,color .25s,border-color .25s}
.pill:hover{border-color:var(--navy)}
.pill.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.pill .alt{font-size:12px;opacity:.75}
.stage-detail{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;align-items:center}
.stage-info{display:flex;flex-direction:column;gap:16px}
.stage-name{font-size:26px;font-weight:800}
.stage-name .alt{font-size:15px;color:var(--blue)}
.stage-what{font-size:18px;font-weight:600}
.stage-ex{font-size:17px;font-weight:600;color:var(--navy)}

/* Cycle diagram (SVG) */
.cycle-diagram svg{display:block;width:100%;height:auto;overflow:visible}
.cyc{--n-fill:#fff;--n-stroke:#D5DDE8;--n-text:#1E3A5F;--n-muted:#5B6B80;--n-on:#FEF5E6;--l:#C3CEDC;--pk-data:var(--data)}
[data-theme=dark] .cyc{--n-fill:rgba(255,255,255,.05);--n-stroke:rgba(255,255,255,.22);--n-text:#fff;--n-muted:#A0AEC0;--n-on:rgba(243,156,18,.2);--l:rgba(255,255,255,.28);--pk-data:#A0AEC0}
.cyc .node rect{fill:var(--n-fill);stroke:var(--n-stroke);stroke-width:1.5;transition:fill .35s,stroke .35s}
.cyc .node.on rect{fill:var(--n-on);stroke:var(--orange);stroke-width:2.5}
.cyc text{text-anchor:middle}
.cyc .t-ico{font-size:21px}
.cyc .t-main{fill:var(--n-text);font-weight:800;font-size:13px}
.cyc .t-alt{fill:var(--n-muted);font-size:9.5px}
html[lang=ar] .t-alt{font-family:var(--mono);font-weight:500}
html[lang=en] .t-alt{font-family:'Cairo',system-ui,sans-serif;font-weight:600;font-size:10.5px}
.cyc .link{stroke:var(--l);stroke-width:2;fill:none;transition:stroke .35s}
.cyc .link.on{stroke:var(--orange);stroke-width:2.5}
.cyc .ah{fill:var(--l)}
.cyc .ah-on{fill:var(--orange)}
.cyc .pk-data rect{fill:var(--pk-data)}
.cyc .pk-info rect.doc{fill:var(--info)}
.cyc .pk-info line{stroke:#fff;stroke-width:1.4;stroke-linecap:round}

/* Data vs information */
.data-info{position:relative}
.data-info-grid{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:16px;align-items:stretch}
.di-card{background:#fff;border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:10px;text-align:center;align-items:center;transition:box-shadow .3s}
.di-data{border:1.5px dashed #B8C4D4}
.di-info{border:1.5px solid var(--green)}
.di-emoji{font-size:24px}
.di-label{font-size:13px;font-weight:700;color:var(--muted)}
.di-info .di-label{color:var(--green-deep)}
.di-text{font-size:16px}
.di-sample{font-family:var(--mono);font-weight:500;font-size:18px;background:#F5F6FA;border-radius:8px;padding:6px 16px;direction:ltr;transition:box-shadow .3s}
.di-result{font-size:18px;font-weight:700;background:var(--green-bg);color:var(--green-deep);border-radius:8px;padding:6px 16px;transition:box-shadow .3s}
.di-note{font-size:14px;color:var(--muted)}
.di-sample.hl{box-shadow:0 0 0 3px rgba(135,149,168,.45)}
.di-result.hl{box-shadow:0 0 0 3px rgba(39,174,96,.45)}
.data-info-arrow{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--blue);font-weight:700;font-size:14px;min-width:80px}
.gear{display:inline-block;font-size:32px;line-height:1}
.data-info-arrow-icon{font-size:24px;line-height:1;display:inline-block}
.tok{position:absolute;top:0;left:0;pointer-events:none;opacity:0;z-index:2}
.tok-data{display:flex;gap:3px}
.tok-data i{width:9px;height:9px;border-radius:2px;background:var(--data)}
.tok-info{width:16px;height:20px;border-radius:3px;background:var(--info);box-shadow:0 2px 6px rgba(39,174,96,.4)}
.plain-note{font-size:15px;color:var(--text2);text-align:center;background:#fff;padding:12px 18px;border-radius:12px;border:1px solid var(--line)}

/* ---------- Components ---------- */
.components-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px}
.cb{cursor:pointer;text-align:center;border-radius:16px;padding:18px;border:1.5px solid var(--line);background:#fff;color:var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:background .25s,color .25s,border-color .25s}
.cb:hover{border-color:var(--navy)}
.cb.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.cb-ico{font-size:26px;margin-bottom:2px}
.cb .alt{font-size:12px;opacity:.75}
.cb-name{font-size:19px;font-weight:800;line-height:1.4}
.cb-fac{font-size:13px;opacity:.85}
.comp-detail{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;align-items:center}
.comp-info{display:flex;flex-direction:column;gap:20px}
.comp-func{font-size:22px;font-weight:800}
.comp-fac{font-size:15px;color:var(--text2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--chip);color:var(--navy);font-weight:600;font-size:15px;padding:6px 14px;border-radius:999px}
.comp-svg svg{display:block;width:100%;height:auto}
.cmp .box{fill:#fff;stroke:var(--line2);stroke-width:1.5;transition:fill .35s,stroke .35s}
.cmp .n.on .box{fill:#EAF2FB;stroke:var(--navy);stroke-width:2.5}
.cmp .n.dim{opacity:.55}
.cmp .n{transition:opacity .35s}
.cmp .other .box{stroke-dasharray:5 4}
.cmp text{text-anchor:middle}
.cmp .t-main{fill:var(--navy);font-weight:800;font-size:13px}
.cmp .t-sm{fill:var(--navy);font-weight:700;font-size:12px}
.cmp .t-ico{font-size:20px}
.cmp .inner{fill:#F5F6FA;stroke:var(--line2);stroke-width:1.2;transition:fill .35s,stroke .35s}
.cmp .n.on .inner{fill:#fff;stroke:var(--blue2)}
.cmp .ln{stroke:#C3CEDC;stroke-width:2;fill:none;transition:stroke .35s}
.cmp .ln.on{stroke:var(--blue);stroke-width:2.5;stroke-dasharray:6 6;animation:flow .9s linear infinite}
.cmp .ah{fill:#C3CEDC}
.cmp .ah-on{fill:var(--blue)}
/* تحرك الخطوط المتقطعة في اتجاه المسار = اتجاه انتقال البيانات */
@keyframes flow{from{stroke-dashoffset:12}to{stroke-dashoffset:0}}

/* ---------- Software ---------- */
.sw-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.sw-card{border-radius:18px;padding:28px;display:flex;flex-direction:column;gap:10px;text-align:center;align-items:center}
.sw-sys{background:var(--navy);color:#fff}
.sw-app{background:#fff;border:1.5px solid var(--blue2)}
.sw-ico{font-size:28px}
.sw-card .alt{font-size:13px}
.sw-sys .alt{opacity:.75}
.sw-app .alt{color:var(--blue)}
.sw-name{font-size:24px;font-weight:800}
.sw-role{font-size:17px}
.sw-sys .sw-role{opacity:.9}
.sw-app .sw-role{color:var(--text2)}
.sw-tags{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.sw-sys .sw-tags span{background:rgba(255,255,255,.12);padding:4px 12px;border-radius:999px;font-size:14px}
.sw-app .sw-tags span{background:var(--chip);padding:4px 12px;border-radius:999px;font-size:14px;color:var(--navy);font-weight:600}
.run-head{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.play-btn{cursor:pointer;font-size:14px;font-weight:700;border:1.5px solid var(--blue2);background:#fff;color:var(--blue);border-radius:999px;padding:5px 16px;transition:background .2s,color .2s}
.play-btn:hover{background:var(--blue2);color:#fff}
.run-steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}
.rs{cursor:pointer;text-align:start;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:18px;display:flex;gap:14px;align-items:center;transition:border-color .25s,box-shadow .25s}
.rs:hover{border-color:var(--blue2)}
.rs.on{border-color:var(--blue2);box-shadow:0 0 0 3px rgba(74,144,217,.18)}
.rs-num{flex:none;width:36px;height:36px;border-radius:50%;background:var(--blue2);color:#fff;display:grid;place-items:center;font-weight:800;font-size:16px}
.rs-num.g{background:var(--green)}
.rs strong{font-size:17px}
.rs .d{color:var(--text2);font-size:14px}
.run-svg{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 12px 8px}
.run-svg svg{display:block;width:100%;max-width:680px;height:auto;margin:0 auto}
.prg .box{fill:#F8FAFC;stroke:var(--line2);stroke-width:1.5;transition:fill .35s,stroke .35s}
.prg .n.on .box{fill:#EAF2FB;stroke:var(--blue2);stroke-width:2.5}
.prg text{text-anchor:middle}
.prg .t-main{fill:var(--navy);font-weight:800;font-size:13px}
.prg .ico{fill:none;stroke:var(--navy);stroke-width:2}
.prg .ico-f{fill:var(--navy)}
.prg .ln{stroke:#C3CEDC;stroke-width:2;fill:none;transition:stroke .35s}
.prg .ln.on{stroke:var(--blue2);stroke-width:2.5}
.prg .ah{fill:#C3CEDC}
.prg .ah-on{fill:var(--blue2)}
.prg .badge rect{fill:var(--blue2)}
.prg .badge line{stroke:#fff;stroke-width:1.3;stroke-linecap:round}
.prg .badge{transition:opacity .3s}
.prg .win{transition:opacity .35s}
.prog-box{background:var(--cream);border-radius:18px;padding:24px 28px;display:flex;flex-direction:column;gap:6px;text-align:center}
.prog-box .k{font-size:13px;color:var(--orange-deep);font-weight:700}
.prog-box p{font-size:17px}
.prog-box p.ex{font-size:15px;color:var(--text2)}

/* ---------- Categories ---------- */
.cat-scroll{overflow-x:auto;padding-bottom:6px}
.cat-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr)) minmax(0,1.15fr);column-gap:8px;row-gap:6px;align-items:end;min-width:900px}
.kb{grid-row:1;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;text-align:center;border-radius:12px;padding:12px 8px;border:1.5px solid var(--line);background:#fff;color:var(--navy);transition:background .25s,color .25s,border-color .25s}
.kb:hover{border-color:var(--blue2)}
.kb.emb{background:var(--cream)}
.kb.on{background:var(--blue2);color:#fff;border-color:var(--blue2)}
.kb-ico{font-size:22px;margin-bottom:2px}
.kb-short{font-size:14px;font-weight:800;line-height:1.35;hyphens:auto;overflow-wrap:anywhere}
html[lang=en] .kb-short{font-size:13px}
.kb.emb{grid-column:8;margin-inline-start:14px}
.cat-sep{grid-column:8;grid-row:1 / span 3;align-self:stretch;border-inline-start:2px dashed var(--line2);margin-inline-start:2px;pointer-events:none}
.cat-bracket{grid-column:1 / span 2;grid-row:2;display:flex;flex-direction:column;align-items:center;gap:2px}
.cat-bracket i{display:block;width:calc(100% - 16px);height:9px;border:2px solid var(--line2);border-top:0;border-radius:0 0 8px 8px}
.cat-bracket span{font-size:12px;font-weight:700;color:var(--muted);text-align:center;line-height:1.4}
.cat-axis{grid-column:1 / span 7;grid-row:3;height:22px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;color:var(--muted)}
.axis-line{flex:1;height:2px;background:var(--line2);position:relative}
.axis-line::after{content:"";position:absolute;top:50%;transform:translateY(-50%);border:6px solid transparent}
[dir=rtl] .axis-line::after{left:-2px;border-right:9px solid var(--line2);border-left:0}
[dir=ltr] .axis-line::after{right:-2px;border-left:9px solid var(--line2);border-right:0}
.cat-detail{display:flex;flex-direction:column;gap:20px}
.cat-top{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:24px}
.cat-name{font-size:24px;font-weight:800}
.cat-alt{font-size:13px;color:var(--blue)}
.cat-desc{font-size:17px;font-weight:600}
.emb-box{border-top:1px solid var(--line);padding-top:20px;display:flex;flex-direction:column;gap:12px}
.emb-box[hidden]{display:none}
.emb-title{font-size:17px;font-weight:800;text-align:center}
.emb-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:10px}
.emb-grid div{background:#F5F6FA;border-radius:12px;padding:14px 16px;text-align:center}
.emb-grid span{font-size:14px;color:var(--text2)}

/* ---------- Information system ---------- */
.el-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:10px}
.el{border-radius:14px;padding:16px 12px;border:1.5px solid var(--line);background:#fff;color:#8795A8;transition:background .35s,color .35s,border-color .35s;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px}
.el.on{background:var(--green);color:#fff;border-color:var(--green)}
.el.pop{animation:pop .45s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
.el-ico{font-size:22px}
.el-name{font-size:19px;font-weight:800}
.el .alt{font-size:12px;opacity:.8}
.st-list{display:flex;flex-direction:column;gap:10px}
.st{cursor:pointer;text-align:start;display:flex;gap:14px;align-items:center;border-radius:14px;padding:14px 18px;border:1.5px solid var(--line);background:transparent;color:var(--navy);font-size:16px;transition:background .25s,border-color .25s}
.st:hover{border-color:var(--green)}
.st.on{background:#fff;border-color:var(--green)}
.st-num{flex:none;width:32px;height:32px;border-radius:50%;background:var(--line);color:var(--navy);display:grid;place-items:center;font-weight:800;font-size:15px;transition:background .25s,color .25s}
.st.on .st-num{background:var(--green);color:#fff}
.st-text{font-weight:600}

/* ---------- Pros & cons ---------- */
.pc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.pc{background:#fff;border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:14px}
.pc-pro{border-top:5px solid var(--green)}
.pc-con{border-top:5px solid var(--red)}
.pc-title{font-size:20px;font-weight:800;text-align:center}
.pc-pro .pc-title{color:var(--green-deep)}
.pc-con .pc-title{color:var(--red-deep)}
.pc-list{display:flex;flex-direction:column;gap:12px}
.pc-item{display:flex;gap:10px;align-items:flex-start}
.pc-item>span{font-size:20px}
.pc-item .d{color:var(--text2)}
.green-box{background:var(--green-bg);border-radius:18px;padding:24px 28px;display:flex;flex-direction:column;gap:8px;text-align:center;border:1px solid var(--green)}
.green-box .ico{font-size:28px}
.green-box .t{font-size:18px;font-weight:800;color:var(--green-deep)}
.green-box .d{font-size:16px}

/* ---------- Quiz ---------- */
.quiz-header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.quiz-head-text{display:flex;flex-direction:column;gap:4px}
.quiz-head-text .section-subtitle{align-self:flex-start}
.quiz-header h2{margin:0;font-size:34px;font-weight:800}
.score{background:var(--navy);color:#fff;font-weight:700;padding:8px 16px;border-radius:10px;font-size:15px;display:inline-block}
.score.bump{animation:pop .4s ease}
.reset{cursor:pointer;border:1.5px solid #B8C4D4;background:#fff;color:var(--navy);font-weight:600;padding:7px 16px;border-radius:10px}
.reset:hover{border-color:var(--navy)}
.quiz-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}
.qc{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 30px -5px rgba(30,58,95,.08)}
.qc-text{font-size:17px;font-weight:700}
.qc-text b{color:var(--blue)}
.qc-opts{display:flex;flex-direction:column;gap:8px}
.opt{cursor:pointer;text-align:start;border-radius:10px;padding:10px 14px;border:1.5px solid #DDE3EC;background:#fff;color:var(--navy);font-size:15px;font-weight:600;transition:background .25s,border-color .25s;display:flex;justify-content:space-between;align-items:center;gap:8px}
.opt:hover:not([disabled]){border-color:var(--blue2)}
.opt[disabled]{cursor:default}
.opt.ok{background:var(--green-bg);border-color:var(--green)}
.opt.bad{background:var(--red-bg);border-color:var(--red)}
.opt.shake{animation:shake .4s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.opt .mk{font-weight:800}
.opt.ok .mk{color:var(--green-deep)}
.opt.bad .mk{color:var(--red-deep)}
.qc-fb{font-size:14px;font-weight:700}

/* ---------- Footer ---------- */
.site-footer{background:var(--navy);color:#fff}
.footer-container{max-width:1120px;margin:0 auto;padding:28px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;font-size:14px}
.footer-prep{opacity:.9;background:rgba(255,255,255,.12);padding:4px 14px;border-radius:6px;font-weight:600}

:focus-visible{outline:3px solid var(--orange);outline-offset:2px}

/* ---------- Responsive ---------- */
@media (max-width:1379px){.header-instructor{display:none}}
@media (max-width:1180px){.brand-sub{display:none}}
@media (max-width:1020px){
  .header-container{display:grid;grid-template-columns:1fr auto;grid-template-areas:"brand lang" "nav nav";row-gap:6px;padding:8px 16px}
  .brand{grid-area:brand}
  .lang-switch{grid-area:lang}
  .header-nav{grid-area:nav;justify-content:flex-start;margin:0 -16px;padding:0 12px}
  :root{--header-h:100px}
}
@media (max-width:900px){
  .stage-detail,.comp-detail{grid-template-columns:1fr}
}
@media (max-width:720px){
  .hero-section{padding:36px 16px 48px}
  .main-container{padding:0 16px}
  .sim-card{padding:14px;border-radius:18px}
  .card{padding:20px}
  .section{padding-top:56px}
  .data-info-grid{grid-template-columns:1fr}
  .data-info-arrow{flex-direction:row;padding:4px 0}
  [dir=rtl] .data-info-arrow-icon{transform:rotate(-90deg)}   /* ← يصبح ↓ */
  [dir=ltr] .data-info-arrow-icon{transform:rotate(90deg)}    /* → يصبح ↓ */
}
/* على الهاتف تُكبَّر نصوص الرسومات لأن الرسم يُصغَّر ليناسب العرض */
@media (max-width:560px){
  .cyc .t-main{font-size:16px} .cyc .t-alt{font-size:11px} .cyc .t-ico{font-size:24px}
  html[lang=en] .cyc .t-main{font-size:14px}
  .cmp .t-main{font-size:16px} .cmp .t-sm{font-size:15px} .cmp .t-ico{font-size:24px}
  html[lang=en] .cmp .t-main{font-size:14.5px}
  html[lang=en] .cmp .t-sm{font-size:13px}
  .prg .t-main{font-size:16px}
  html[lang=en] .prg .t-main{font-size:15px}
  .components-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cb{padding:14px 10px}
  .cb-name{font-size:17px}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<header class="site-header">

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;

const wait = ms => new Promise(r => setTimeout(r, RM ? 0 : ms));
const tr = (x, y, s = 1) => `translate(${x}px, ${y}px) scale(${s})`;
function move(el, frames, ms, opts = {}) {
  const a = el.animate(frames, { duration: RM ? 0 : ms, easing: opts.easing || 'cubic-bezier(.45,0,.25,1)', fill: 'forwards', delay: RM ? 0 : (opts.delay || 0) });
  return a.finished.catch(() => {});
}
const stop = el => el && el.getAnimations().forEach(a => a.cancel());
function swap(el) { el.classList.remove('swap'); void el.offsetWidth; el.classList.add('swap'); }
function fill(root, obj) { $$('[data-f]', root).forEach(n => { const v = obj[n.dataset.f]; if (typeof v === 'string') n.textContent = v; }); }
// نص SVG يدعم سطرين (مفصولين بـ \n) مع توسيط عمودي
function svgText(x, y, text, cls) {
  const lines = String(text).split('\n');
  if (lines.length === 1) return `<text class="${cls}" x="${x}" y="${y}">${esc(text)}</text>`;
  const lh = 1.15, first = -((lines.length - 1) * lh) / 2;
  return `<text class="${cls}" x="${x}" y="${y}">${lines.map((l, i) => `<tspan x="${x}" dy="${i ? lh : first}em">${esc(l)}</tspan>`).join('')}</text>`;
}

const CY_LINK = [0, null, 1, 2];
function showCycle(d, step) {
  d.nodes.forEach((g, i) => g.classList.toggle('on', i === step));
  d.links.forEach((p, i) => {
    const on = CY_LINK[step] === i;
    p.classList.toggle('on', on);
    p.setAttribute('marker-end', `url(#${d.id}${on ? 'b' : 'a'})`);
  });
  const { data, info } = d; stop(data); stop(info);
  data.style.opacity = 0; info.style.opacity = 0;
  if (step === 0) {        // الإدخال: بيانات خام تنتقل من جهاز الإدخال إلى المعالج
    move(data, [{ transform: tr(...P('inStart')), opacity: 0 }, { transform: tr(...P('inStart')), opacity: 1, offset: .15 }, { transform: tr(...P('inDock')), opacity: 1 }], 1100);
  } else if (step === 1) { // المعالجة: البيانات تدخل المعالج وتخرج منه معلومات
    move(data, [{ transform: tr(...P('inDock')), opacity: 1 }, { transform: tr(...P('cpu'), .6), opacity: 0 }], 700);
    move(info, [{ transform: tr(...P('cpu'), .6), opacity: 0 }, { transform: tr(...P('cpuOut')), opacity: 1 }], 700, { delay: 650 });

/* =====================================================================
   2) البيانات → معالجة → معلومات (شريحة 7)
   قطعة بيانات خام تذهب إلى الترس، يدور الترس (معالجة)، ثم تخرج معلومة.
   تعمل فقط عندما يكون الجزء ظاهراً على الشاشة.
   ===================================================================== */
(function dataInfo() {
  const wrap = $('#dataInfo'), src = $('[data-src]', wrap), dst = $('[data-dst]', wrap);
  const gear = $('.gear', wrap), tD = $('.tok-data', wrap), tI = $('.tok-info', wrap);
  let visible = false, running = false;
  const c = el => {
    const r = el.getBoundingClientRect(), w = wrap.getBoundingClientRect();
    return [r.left + r.width / 2 - w.left, r.top + r.height / 2 - w.top];
  };
  const at = (tok, p, s = 1) => tr(p[0] - tok.offsetWidth / 2, p[1] - tok.offsetHeight / 2, s);
  const spin = () => (isRTL() ? 'rotate(-360deg)' : 'rotate(360deg)');
  async function loop() {
    if (running) return; running = true;
    while (visible) {
      const a = c(src), g = c(gear), b = c(dst);
      src.classList.add('hl');
      await wait(700);
      await move(tD, [{ transform: at(tD, a), opacity: 0 }, { transform: at(tD, a), opacity: 1, offset: .12 }, { transform: at(tD, g, .8), opacity: 1, offset: .88 }, { transform: at(tD, g, .5), opacity: 0 }], 1100);
      src.classList.remove('hl');
      await move(gear, [{ transform: 'rotate(0deg)' }, { transform: spin() }], 1100, { easing: 'ease-in-out' });
      await move(tI, [{ transform: at(tI, g, .5), opacity: 0 }, { transform: at(tI, g), opacity: 1, offset: .15 }, { transform: at(tI, b), opacity: 1, offset: .9 }, { transform: at(tI, b), opacity: 0 }], 1100);
      dst.classList.add('hl');
      await wait(1800);
      dst.classList.remove('hl');
      await wait(900);
      if (RM) break;
    }
    running = false;
  }
  new IntersectionObserver(es => { visible = es[0].isIntersecting; if (visible) loop(); }, { threshold: .5 }).observe(wrap);
})();

  document.title = t('docTitle');
  $$('[data-t]').forEach(el => { el.innerHTML = t(el.dataset.t); });
  $$('[data-t-aria]').forEach(el => el.setAttribute('aria-label', t(el.dataset.tAria)));
  // العنوان الصغير فوق كل قسم مكتوب باللغة الأخرى، فيأخذ اتجاهها
  $$('.section-subtitle').forEach(el => el.setAttribute('dir', isRTL() ? 'ltr' : 'rtl'));
  $$('.lang-switch button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === L));
  buildCycleUI(); renderAutoToggle(); renderCycle(); schedule();
  buildComp(); renderComp();
  const keep = run.cur; buildRun(); run.busy++; run.play++; runState(keep);
  buildCats(); renderCat();
  buildSys(); renderSys(false);
  buildPros();
  buildQuiz(); renderQuiz();
  if (!first) {
    try { localStorage.setItem('cb-lang', L); } catch (e) {}
    try { const u = new URL(location.href); u.searchParams.set('lang', L); history.replaceState(null, '', u); } catch (e) {}
  }
}
$$('.lang-switch button').forEach(b => b.addEventListener('click', () => { if (b.dataset.lang !== L) setLang(b.dataset.lang); }));
function initialLang() {
  try { const q = new URLSearchParams(location.search).get('lang'); if (q === 'en' || q === 'ar') return q; } catch (e) {}
  try { const s = localStorage.getItem('cb-lang'); if (s === 'en' || s === 'ar') return s; } catch (e) {}
  return 'ar';
}
setLang(initialLang(), true);
// أول مرة يظهر فيها مخطط تشغيل البرنامج: تُعرض الخطوات تلقائياً مرة واحدة
new IntersectionObserver((es, ob) => { if (es[0].isIntersecting) { ob.disconnect(); if (run.cur === 0) playRun(); } }, { threshold: .6 }).observe($('#runSvg'));

/* ================= التنقل: إبراز القسم الحالي + شريط تقدّم القراءة ================= */
const navLinks = $$('#nav a');
const secObs = new IntersectionObserver(es => {
  es.forEach(e => {
    if (!e.isIntersecting) return;
    navLinks.forEach(a => a.classList.toggle('active', a.getAttribute('href') === '#' + e.target.id));
  });
}, { rootMargin: '-40% 0px -55% 0px' });
['top', 'what', 'components', 'software', 'categories', 'system', 'proscons', 'quiz'].forEach(id => secObs.observe(document.getElementById(id)));
const bar = $('#readBar');
const onScroll = () => {
  const h = document.documentElement.scrollHeight - innerHeight;
  bar.style.width = (h > 0 ? scrollY / h * 100 : 0) + '%';
};
addEventListener('scroll', onScroll, { passive: true }); onScroll();
})();
</script>
</body>
</html>
